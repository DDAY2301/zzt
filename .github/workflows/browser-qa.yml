name: ZZT visual and browser quality checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/browser-qa.yml'
      - 'src/qa_e2e.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser testing
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Build and cache real photographs
        run: |
          python src/build_site.py
          python src/cache_photos.py
          python src/qa_static.py
      - name: Check homepage and pages in Chromium
        run: python src/qa_e2e.py
      - name: Preserve screenshots and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ZZT-browser-QA
          path: qa_artifacts/
          if-no-files-found: warn
