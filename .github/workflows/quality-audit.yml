name: Audit published ZZT accessibility and performance

on:
  push:
    branches: [codex/zzt-quality-audit]

permissions:
  contents: read

jobs:
  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser and axe-core
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/zzt-audit" --no-save --no-package-lock axe-core@4.10.3
      - name: Audit production pages with axe-core and keyboard checks
        run: AXE_SCRIPT="$RUNNER_TEMP/zzt-audit/node_modules/axe-core/axe.min.js" python .github/audit/audit_accessibility.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZZT-accessibility-audit
          path: audit-results/accessibility.json
  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Measure the public site with Lighthouse
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p audit-results
          npm install --prefix "$RUNNER_TEMP/zzt-audit" --no-save --no-package-lock lighthouse@12.6.0
          lighthouse="$RUNNER_TEMP/zzt-audit/node_modules/.bin/lighthouse"
          run_lighthouse() {
            name="$1"
            url="$2"
            shift 2
            "$lighthouse" "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance --output=json --output-path="audit-results/$name.json" --quiet "$@"
          }
          for run in 1 2 3; do
            run_lighthouse "home-mobile-$run" https://zavod-zzt.eu/
          done
          run_lighthouse home-desktop https://zavod-zzt.eu/ --preset=desktop
          run_lighthouse projects-mobile https://zavod-zzt.eu/projekti/
          python - <<'PY'
          import json
          from pathlib import Path

          for file in sorted(Path("audit-results").glob("*.json")):
              report = json.loads(file.read_text())
              assert not report.get("runtimeError"), report.get("runtimeError")
              audits = report["audits"]
              values = {label: round(audits[id]["numericValue"], 3) for label, id in (
                  ("LCP_ms", "largest-contentful-paint"), ("CLS", "cumulative-layout-shift"),
                  ("TBT_ms", "total-blocking-time"), ("TTFB_ms", "server-response-time"),
              )}
              values["performance"] = round(report["categories"]["performance"]["score"] * 100)
              lcp = audits.get("largest-contentful-paint-element", {})
              values["lcp_element"] = str(lcp.get("details", {}).get("items", []))[:1200]
              print(file.stem, report["finalDisplayedUrl"], json.dumps(values))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZZT-lighthouse-results
          path: audit-results
