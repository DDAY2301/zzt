name: Publish ZZT website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build all public pages from verified content model
        run: |
          python3 -m py_compile src/build_site.py
          python3 src/build_site.py
      - name: Cache licensed photographs for stable display
        run: python3 src/cache_photos.py
      - name: Keep GitHub Pages branch-root compatible
        run: python3 src/mirror_pages_root.py
      - name: Validate generated website and JavaScript
        run: |
          test -f site/index.html
          test -f site/assets/site.css
          test -f site/CNAME
          test -f site/sitemap.xml
          test -f site/robots.txt
          cmp index.html site/index.html
          cmp assets/site.css site/assets/site.css
          cmp assets/site.js site/assets/site.js
          node --check site/assets/site.js
          python3 src/qa_static.py
          python3 -c "from pathlib import Path; p=list(Path('site').rglob('index.html')); assert len(p)>=14; assert sum('Kolpa' in x.read_text(encoding='utf-8') for x in p)>0; assert all('zavod-zzt.eu' in x.read_text(encoding='utf-8') for x in p); print('Checked',len(p),'site pages')"
      - name: Commit generated HTML and licensed photo assets to repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- site/ assets/ index.html 404.html CNAME .nojekyll sitemap.xml robots.txt .pages-root-manifest.json o-zavodu/ raziskave-in-razvoj/ izobrazevanje-in-mladi/ projekti/ ekipa-in-izkusnje/ sodelovanje/ publikacije-in-objave/ kontakt/ zasebnost/ viri-fotografij/
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize generated website [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
