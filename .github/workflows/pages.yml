name: Publish ZZT website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Build all public pages from verified content model
        run: |
          python3 -m py_compile src/build_site.py
          python3 src/build_site.py
      - name: Cache licensed photographs for stable display
        run: python3 src/cache_photos.py
      - name: Validate generated website and JavaScript
        run: |
          test -f site/index.html
          test -f site/assets/site.css
          test -f site/CNAME
          test -f site/sitemap.xml
          test -f site/robots.txt
          node --check site/assets/site.js
          python3 src/qa_static.py
          python3 -c "from pathlib import Path; p=list(Path('site').rglob('index.html')); assert len(p)>=14; assert sum('Kolpa' in x.read_text(encoding='utf-8') for x in p)>0; assert all('zavod-zzt.eu' in x.read_text(encoding='utf-8') for x in p); print('Checked',len(p),'site pages')"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
